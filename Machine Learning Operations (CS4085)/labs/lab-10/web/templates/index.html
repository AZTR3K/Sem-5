<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Predictor</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f4; }
        .container { max-width: 500px; margin: auto; padding: 20px; background: #fff; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { text-align: center; }
        form { display: flex; flex-direction: column; }
        label { margin-bottom: 5px; font-weight: bold; }
        input[type="number"] { padding: 10px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #ccc; }
        input[type="submit"] { background: #007bff; color: white; padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        input[type="submit"]:hover { background: #0056b3; }
        .prediction { text-align: center; font-size: 20px; margin-top: 20px; font-weight: bold; color: #333; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Student Performance Predictor</h1>
        <form action="/predict" method="POST">
            <label for="study_hours">Study Hours:</label>
            <input type="number" step="0.1" id="study_hours" name="study_hours" required>

            <label for="sleep_hours">Sleep Hours:</label>
            <input type="number" step="0.1" id="sleep_hours" name="sleep_hours" required>

            <input type="submit" value="Predict">
        </form>

        <!-- This is where the prediction result will be shown -->
        {% if prediction_text %}
            <div class="prediction">
                {{ prediction_text }}
            </div>
        {% endif %}
    </div>
</body>
</html>
